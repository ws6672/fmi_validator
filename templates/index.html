<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMU 验证器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
        }
        .upload-area.dragover {
            border-color: #0d6efd;
            background-color: rgba(13, 110, 253, 0.1);
        }
        .progress-area {
            margin: 20px 0;
            display: none;
        }
        .result-area {
            margin: 20px 0;
            display: none;
        }
        .error-message {
            color: #dc3545;
            margin: 10px 0;
            display: none;
        }
        pre {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">FMU 文件验证器</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="upload-area" id="dropZone">
                    <p class="mb-2">拖拽 FMU 文件到此处或点击选择文件</p>
                    <input type="file" id="fileInput" accept=".fmu" class="d-none">
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                        选择文件
                    </button>
                </div>

                <div class="error-message" id="errorMessage"></div>

                <div class="progress-area" id="progressArea">
                    <h5>验证进度</h5>
                    <div class="progress mb-3">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" 
                             id="progressBar"
                             style="width: 0%">0%</div>
                    </div>
                    <p id="progressStatus" class="text-muted"></p>
                </div>

                <div class="result-area" id="resultArea">
                    <h5>验证结果</h5>
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-subtitle mb-2 text-muted" id="resultTimestamp"></h6>
                            <pre id="resultContent"></pre>
                            <div class="text-end">
                                <button class="btn btn-secondary" id="downloadReport">
                                    下载完整报告
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const progressArea = document.getElementById('progressArea');
        const progressBar = document.getElementById('progressBar');
        const progressStatus = document.getElementById('progressStatus');
        const resultArea = document.getElementById('resultArea');
        const resultContent = document.getElementById('resultContent');
        const resultTimestamp = document.getElementById('resultTimestamp');
        const errorMessage = document.getElementById('errorMessage');
        const downloadReport = document.getElementById('downloadReport');

        let currentReportId = null;
        let progressCheckInterval = null;

        // 拖放处理
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('dragover');
        }

        function unhighlight(e) {
            dropZone.classList.remove('dragover');
        }

        dropZone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFileSelect, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const file = dt.files[0];
            handleFile(file);
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            handleFile(file);
        }

        function handleFile(file) {
            if (!file) return;
            
            if (!file.name.endsWith('.fmu')) {
                showError('请选择 .fmu 文件');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            // 重置界面
            resetUI();
            showProgress();
            startProgressCheck();

            // 发送验证请求
            fetch('/validate', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                stopProgressCheck();
                if (data.success) {
                    showResult(data);
                    currentReportId = data.report_id;
                } else {
                    showError(data.error);
                }
            })
            .catch(error => {
                stopProgressCheck();
                showError('验证过程中发生错误: ' + error.message);
            });
        }

        function resetUI() {
            errorMessage.style.display = 'none';
            progressArea.style.display = 'none';
            resultArea.style.display = 'none';
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            progressStatus.textContent = '';
            resultContent.textContent = '';
            resultTimestamp.textContent = '';
            currentReportId = null;
        }

        function showProgress() {
            progressArea.style.display = 'block';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function showResult(data) {
            resultArea.style.display = 'block';
            resultTimestamp.textContent = `验证时间: ${data.timestamp}`;
            resultContent.textContent = JSON.stringify(data.report, null, 2);
        }

        function startProgressCheck() {
            stopProgressCheck();
            progressCheckInterval = setInterval(checkProgress, 500);
        }

        function stopProgressCheck() {
            if (progressCheckInterval) {
                clearInterval(progressCheckInterval);
                progressCheckInterval = null;
            }
        }

        function checkProgress() {
            fetch('/validate/progress')
                .then(response => response.json())
                .then(data => {
                    progressBar.style.width = `${data.progress}%`;
                    progressBar.textContent = `${Math.round(data.progress)}%`;
                    progressStatus.textContent = `${data.status}: ${data.message}`;
                })
                .catch(error => console.error('进度检查失败:', error));
        }

        downloadReport.addEventListener('click', () => {
            if (currentReportId) {
                window.location.href = `/reports/${currentReportId}`;
            }
        });
    </script>
</body>
</html>
